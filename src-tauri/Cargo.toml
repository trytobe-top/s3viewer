[package]
name = "s3viewer"
version = "0.2.0"
description = "A multi-backend S3 client built with Tauri"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "s3viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
aws-config = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
aws-smithy-http-client = { version = "1", features = ["hyper-014"] }
aws-smithy-runtime-api = "1"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-pki-types = "1"
hyper-rustls = { version = "0.24", default-features = false, features = ["http1", "tls12"] }
anyhow = "1"
base64 = "0.22"
bytes = "1"
http-body = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
opt-level = 2
