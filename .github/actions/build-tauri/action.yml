name: Build Tauri app
description: Install dependencies and build a Tauri app for the given Rust target

inputs:
  target:
    description: Rust target triple to compile for
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    - name: Setup sccache
      uses: mozilla/sccache-action@v0.0.6

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        cache-on-failure: true

    - name: Build
      shell: bash
      run: pnpm tauri build

    - name: List bundle files
      shell: bash
      run: find src-tauri/target/release/bundle -type f || echo "no bundle files"